name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - windows-11-arm
          - macos-15
          - macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install # from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci

  sdk:
    name: C/C++ SDK (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, compiler: gcc, cc: gcc, cxx: g++ }
          - { os: ubuntu-24.04, compiler: clang, cc: clang, cxx: clang++ }
          - { os: ubuntu-24.04-arm, compiler: gcc, cc: gcc, cxx: g++ }
          - { os: windows-2025, compiler: msvc }
          - { os: windows-11-arm, compiler: msvc }
          - { os: macos-15, compiler: apple-clang }
          - { os: macos-15-intel, compiler: apple-clang }
    steps:
      - if: matrix.cc
        shell: bash
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - run: rustup toolchain install # from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask sdk Release

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.96 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.96 check --workspace --all-targets

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
